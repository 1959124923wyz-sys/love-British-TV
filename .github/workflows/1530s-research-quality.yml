name: "1530s territorial research quality"
on:
  push:
    branches:
      - "research/territorial-1530-1539-20261013"
  pull_request:
    paths:
      - "research/periods/1530-1539/**"
      - ".github/workflows/1530s-research-quality.yml"
permissions:
  contents: read
jobs:
  evaluate-historical-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate control continuity and evidence
        run: python3 research/periods/1530-1539/validate_research.py
