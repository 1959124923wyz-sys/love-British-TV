name: Glencoe 1692 decade slider browser QA
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'js/history-stories.js'
      - 'data/stories/serial/**'
      - 'scripts/browser_serial_1692_story.py'
      - '.github/workflows/serial-1692-browser.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'js/history-stories.js'
      - 'data/stories/serial/**'
      - 'scripts/browser_serial_1692_story.py'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install selenium
      - name: Verify same-slider event and article path
        run: |
          python -m http.server 8765 &
          python scripts/browser_serial_1692_story.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glencoe-1692-browser-screenshots
          path: browser-smoke-results/*1692*.png
