name: 18C source-first reader UX overlap pilot
on:
  push:
    branches:
      - ux/18c-reader-overlap-inspector-pilot-20261112
  pull_request:
    branches:
      - map/18c-39-caribbean-1759-gold-coast-persian-gulf-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-static-archive-gis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No lost original zones, year overlaps and unchanged 18C historical source QA
        run: |
          node --check app.js
          node --check js/eighteenth-reader-overlap-pilot.js
          node scripts/test_18c_reader_overlap_ux.js
          node scripts/test_18c_batch39_126_83.js
          node scripts/test_18c_batch38_127_90.js
          node scripts/test_18c_batch37_141_108.js
          node scripts/test_18c_batch36_130_83.js
          node scripts/test_18c_mass_spatial_81_42.js
          node scripts/test_18c_spatial_paint_24_15.js
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_r33_original_archive_gaps.py
          python3 scripts/audit_spatial_semantics.py --strict
  reader-real-desktop-1780x1020:
    needs: reader-static-archive-gis
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Desktop reader source chooser, 1762/1763, filters, old map regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-reader-http.log 2>&1 &
          python3 scripts/browser_18c_reader_overlap_pilot.py
          python3 scripts/browser_18c_batch39_126_83.py
          python3 scripts/browser_18c_batch38_127_90.py
      - name: Keep real desktop reader experience and overlapping archives proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-reader-overlap-desktop-evidence
          path: browser-smoke-results/
          if-no-files-found: ignore
  reader-fixed-sha-preview:
    needs: reader-static-archive-gis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm public immutable source-first reader pilot and unchanged archive inputs
        run: |
          set -eu
          BASE="https://raw.githack.com/$GITHUB_REPOSITORY/$GITHUB_SHA"
          for f in index.html app.js js/eighteenth-reader-overlap-pilot.js css/eighteenth-reader-overlap-pilot.css data/eighteenth-century-dynamic-spatial-1700-1799.json data/eighteenth-century-mass-schematic-zones-1700-1799.json data/eighteenth-century-b39-caribbean-1759-1763.json; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --output /dev/null "$BASE/$f"
          done
