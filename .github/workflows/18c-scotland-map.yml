name: 18C Scotland Darien 1707 Union Jacobite Highland land 1746 history QA
on:
  push:
    branches:
      - map/18c-scotland-union-culloden-clearances-20261108
  pull_request:
    branches:
      - map/18c-australia-first-fleet-resistance-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-seven-story-source-gis-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Scotland and existing 6 high-evidence stories, complete historic research ZIP and strict geography
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_18c_scotland_map.js
          node scripts/test_18c_australia_map.js
          node scripts/test_18c_ireland_map.js
          node scripts/test_18c_atlantic_zong_map.js
          node scripts/test_18c_jamaica_maroon_map.js
          node scripts/test_18c_bengal_continuity_map.js
          node scripts/test_18c_acadia_map_pilot.js
          node scripts/test_editor7_17c_inline_story_map.js
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_scotland_source_registry.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/stories/serial/chronology-preview-scotland-1700-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t31-t32-scotland-union-culloden-1700-1799.json >/dev/null
          python3 -m json.tool research/continuity/1700-1707-scotland/STATE_AND_DARIEN_ACTOR_TRANSITIONS.json >/dev/null
  actual-desktop-chromium:
    needs: full-seven-story-source-gis-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Scottish battles, legal dates, old Scotland prequel and all six desktop smoke regressions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-scotland-http.log 2>&1 &
          python3 scripts/browser_18c_scotland_union.py
          python3 scripts/browser_18c_australia_resistance.py
          python3 scripts/browser_18c_ireland_rebellion.py
          python3 scripts/browser_18c_atlantic_zong.py
          python3 scripts/browser_18c_jamaica_maroon.py
          python3 scripts/browser_18c_bengal_continuity.py
          python3 scripts/browser_18c_acadia_pilot.py
      - name: Save desktop visual evidence for Scottish and earlier subjects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-scotland-union-darien-highland-culloden-desktop-screenshots
          path: browser-smoke-results/
          if-no-files-found: ignore
