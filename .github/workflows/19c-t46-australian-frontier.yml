name: 19C T46 Australian frontier five-chapter history and GIS QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t46-australian-frontier-land-violence-1829-1897.json'
      - 'data/research/19c-t46-*.json'
      - 'research/19c/consolidated/T46*'
      - 'docs/research/19C_T46_*'
      - 'scripts/test_19c_t46_australian_frontier.cjs'
      - 'scripts/browser_19c_t46_australian_frontier.py'
      - '.github/workflows/19c-t46-australian-frontier.yml'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/e19-t46-australian-frontier-land-violence-1829-1897.json'
permissions:
  contents: read
jobs:
  facts-and-gis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_19c_t46_australian_frontier.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  desktop-story-map:
    needs: facts-and-gis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t46.log 2>&1 &
          python3 scripts/browser_19c_t46_australian_frontier.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 19c-t46-australian-frontier-desktop-map-proof
          path: browser-smoke-results/19c-t46-*.png
          if-no-files-found: ignore
