name: 18C Mysore wars 1767-1799 Tipu conquest prize and multi-actor partition QA
on:
  push:
    branches:
      - map/18c-mysore-wars-partition-20261109
  pull_request:
    branches:
      - map/18c-scotland-union-culloden-clearances-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-eight-story-source-gis-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Mysore T17 sources and earlier seven long-stories, unchanged archive and GIS
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_18c_mysore_map.js
          node scripts/test_18c_scotland_map.js
          node scripts/test_18c_australia_map.js
          node scripts/test_18c_ireland_map.js
          node scripts/test_18c_atlantic_zong_map.js
          node scripts/test_18c_jamaica_maroon_map.js
          node scripts/test_18c_bengal_continuity_map.js
          node scripts/test_18c_acadia_map_pilot.js
          node scripts/test_editor7_17c_inline_story_map.js
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_mysore_source_registry.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/stories/serial/chronology-preview-mysore-1700-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t17-mysore-wars-partition-1767-1799.json >/dev/null
          python3 -m json.tool research/continuity/1792-1799-mysore/MULTI_ACTOR_PARTITION_RESEARCH.json >/dev/null
  actual-desktop-chromium:
    needs: full-eight-story-source-gis-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Mysore and seven prior stories real desktop 1780x1020 history/map regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-mysore-http.log 2>&1 &
          python3 scripts/browser_18c_mysore_wars.py
          python3 scripts/browser_18c_scotland_union.py
          python3 scripts/browser_18c_australia_resistance.py
          python3 scripts/browser_18c_ireland_rebellion.py
          python3 scripts/browser_18c_atlantic_zong.py
          python3 scripts/browser_18c_jamaica_maroon.py
          python3 scripts/browser_18c_bengal_continuity.py
          python3 scripts/browser_18c_acadia_pilot.py
      - name: Store live desktop map screenshots and browser failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-mysore-four-wars-1792-1799-desktop-screenshots
          path: browser-smoke-results/
          if-no-files-found: ignore
