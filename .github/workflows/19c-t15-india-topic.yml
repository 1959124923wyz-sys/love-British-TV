name: 19C T15 Indian uprising longform and GIS QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t15-indian-uprising-reprisals-1857-1859.json'
      - 'research/19c/consolidated/T15*'
      - 'scripts/test_19c_t15_topic_map.cjs'
      - 'scripts/browser_19c_t15_topic.py'
      - '.github/workflows/19c-t15-india-topic.yml'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/e19-t15-indian-uprising-reprisals-1857-1859.json'
      - 'research/19c/consolidated/T15*'
permissions:
  contents: read
jobs:
  contract-and-spatial-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_19c_t15_topic_map.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  desktop-reader-and-map:
    needs: contract-and-spatial-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/t15-map.log 2>&1 &
          python3 scripts/browser_19c_t15_topic.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 19c-t15-india-reader-desktop
          path: browser-smoke-results/19c-t15-*.png
          if-no-files-found: ignore
