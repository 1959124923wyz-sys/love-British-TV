name: Atlas 45 historical 17C and 18C chapter narratives
on:
  push:
    branches:
      - ux/atlas-45-17c-18c-chapter-narratives-20261112
  pull_request:
    branches:
      - fix/atlas-44-single-area-click-no-editorial-warnings-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chapters-source-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, decade narrative evidence and preserved original spatial interactions
        run: |
          node --check app.js
          node --check js/century-chapter-narratives.js
          node --check scripts/test_atlas_45_century_chapters.js
          python3 -m py_compile scripts/browser_atlas_45_decade_chapters.py
          node scripts/test_atlas_45_century_chapters.js
          node scripts/test_atlas_44_single_area_clean_ui.js
          node scripts/test_reader_clean_copy_1497_1799.js
          node scripts/test_historic_overlap_1497_1699.js
          node scripts/test_18c_right_overlap_hover.js
          python3 scripts/audit_spatial_semantics.py --strict
  chapters-real-chromium:
    needs: chapters-source-and-static
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Real 1780x1020 chapter headings across 16th, 17th and 18th centuries
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas45-http.log 2>&1 &
          python3 scripts/browser_atlas_45_decade_chapters.py
          python3 scripts/browser_atlas_44_single_area_click.py
      - name: Save desktop chapter screenshots and earlier polygon click regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas45-century-chapter-narratives-desktop
          path: browser-smoke-results/
          if-no-files-found: ignore
  chapters-preview:
    needs: chapters-source-and-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: New chapter resource and chapter text are publicly accessible at fixed commit
        run: |
          set -eu
          ROOT="https://raw.githack.com/$GITHUB_REPOSITORY/$GITHUB_SHA"
          for path in index.html app.js js/century-chapter-narratives.js data/atlas-1600-1609.json data/stories/serial/chronology-preview-bengal-1750-1779.json; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --output /dev/null "$ROOT/$path"
          done
