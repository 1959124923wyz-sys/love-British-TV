  public-draft-web-preview:
    needs: twentythree-story-source-GIS-and-reader
    runs-on: ubuntu-latest
    steps:
      - name: Verify 23-story T10 public research preview files
        run: |
          set -e
          BASE="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}"
          for path in index.html app.js js/history-stories.js css/history-stories.css data/stories/serial/preview-18c-index.json data/stories/serial/chronology-preview-t10-walking-purchase-1734-1762.json data/stories/serial/e18-t10-walking-purchase-lenape-lancaster-easton-1734-1762.json data/stories/serial/chronology-preview-t08-seven-years-1740-1775.json data/stories/serial/e18-t08-seven-years-cherokee-pontiac-paxton-1740-1775.json data/stories/serial/chronology-preview-t09-tuscarora-yamasee-1702-1732.json data/stories/serial/e18-t09-tuscarora-yamasee-captivity-1702-1732.json data/stories/serial/chronology-preview-t11-slavery-law-resistance-1702-1741.json data/stories/serial/e18-t11-virginia-newyork-stono-slavery-1702-1741.json data/stories/serial/chronology-preview-fedon-grenada-haiti-1789-1798.json data/stories/serial/e18-t06-fedon-grenada-haiti-colonial-repression-1789-1798.json; do
            curl --fail --location --retry 3 --retry-delay 3 --max-time 30 --silent --show-error "$BASE/$path" -o "/tmp/t06-$(basename "$path")"
          done
          grep -q '帝国的代价' /tmp/t06-index.html
          grep -q 'E18C-T10-1737-SEP19-RUN' /tmp/t06-chronology-preview-t10-walking-purchase-1734-1762.json
          grep -q 'E18-T10-WALKING-PURCHASE-LENAPE-LANCASTER-EASTON-1734-1762' /tmp/t06-preview-18c-index.json
          grep -q 'E18C-T08-1763-POX-BLANKETS' /tmp/t06-chronology-preview-t08-seven-years-1740-1775.json
          grep -q 'E18-T08-SEVEN-YEARS-CHEROKEE-PONTIAC-PAXTON-1740-1775' /tmp/t06-preview-18c-index.json
          grep -q 'E18C-T09-1713-MAR23-NEOHEROKA-BURNING' /tmp/t06-chronology-preview-t09-tuscarora-yamasee-1702-1732.json
          grep -q 'E18-T09-TUSCARORA-YAMASEE-INDIGENOUS-CAPTIVITY-1702-1732' /tmp/t06-preview-18c-index.json
          grep -q 'E18C-T11-1739-STONO-MILITIA-KILLINGS' /tmp/t06-chronology-preview-t11-slavery-law-resistance-1702-1741.json
          grep -q 'E18-T11-VIRGINIA-NEWYORK-STONO-SLAVERY-1702-1741' /tmp/t06-preview-18c-index.json
          grep -q 'E18C-FED-1796-JUN7-ENSLAVED-REBEL-LAW' /tmp/t06-chronology-preview-fedon-grenada-haiti-1789-1798.json
          grep -q 'E18-T06-FEDON-GRENADA-HAITI-BRITISH-REPRESSION-1789-1798' /tmp/t06-preview-18c-index.json
          if grep -q 'story-reading-toolbar' /tmp/t06-history-stories.js; then echo 'BUG: deleted dynamic TOC still present'; exit 1; fi
          echo "T10_WALKING_PURCHASE_REVIEW_URL=$BASE/index.html?review18c=1&year=1737"
