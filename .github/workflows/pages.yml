name: Publish historical atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate atlas data and static assets
        run: |
          python3 scripts/validate_atlas.py
          python3 scripts/validate_approved_ui.py
          node --check app.js
          node scripts/test_chronology.js
          node scripts/test_map_interactions.js
          node scripts/test_event_focus.js
          node scripts/test_chapter4_published.js
          node scripts/test_chapter5_published.js
          node scripts/test_chapter6_published.js
          node scripts/test_norfolk_kett_1549.js
          node scripts/test_western_prayerbook_1549.js
          node scripts/test_munster_gilbert_1569.js
          node scripts/test_armada_survivors_1588.js
          node scripts/test_drake_chile_1578.js
          node scripts/test_chapter7_published.js
          node scripts/test_calais_governance.js
          node scripts/test_shared_territorial_geometries.js
          node scripts/test_chapter8_published.js
          node scripts/test_chapter9_published.js
          node scripts/test_chapter10_published.js
          node scripts/test_munster_invasion_impact.js
          node scripts/test_tenth_land_and_drake_areas.js
          node scripts/test_chapter11_published.js
          node scripts/test_nine_years_war_impact.js
          node scripts/test_caribbean_maghreb_1551_1598.js
          node scripts/test_historical_spatial_narrative_standard.js
          node scripts/test_ch11_named_geolocation_and_links.js
          node scripts/test_war_zone_dossiers.js
          node scripts/test_two_public_layers.js
          node scripts/validate_published_data_references.js
          node scripts/test_localization_and_control_display.js
          node scripts/test_timeline_scale.js
          node scripts/test_merged_first_chapter.js
          node scripts/test_geographic_precision.js
          node scripts/test_voyage_routes.js
          node scripts/test_historical_basemap.js
          grep -q 'id="toggleEvents"' index.html
          grep -q 'css/dark-atlas-v2.css' index.html
          grep -q 'BlueMarble_ShadedRelief_Bathymetry' app.js
          test -s data/natural-earth-land-110m.topojson
          test -s index.html
          test -s app.js
          test -s style.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
