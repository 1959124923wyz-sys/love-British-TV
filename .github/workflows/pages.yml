name: Publish historical atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate atlas data and static assets
        run: |
          python3 scripts/validate_atlas.py
          python3 scripts/validate_approved_ui.py
          node --check app.js
          node scripts/test_chronology.js
          node scripts/test_map_interactions.js
          node scripts/test_event_focus.js
          node scripts/test_chapter4_published.js
          node scripts/test_geographic_precision.js
          grep -q 'id="toggleEvents"' index.html
          grep -q 'css/dark-atlas-v2.css' index.html
          grep -q 'tile.openstreetmap.org' app.js
          test -s index.html
          test -s app.js
          test -s style.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
