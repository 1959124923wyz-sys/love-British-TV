name: Publish historical atlas
on:
  push:
    branches: [main]
    # Ordinary research/archival Markdown edits do not change the actual atlas
    # application; avoid redundant Pages deployments and user notifications.
    paths:
      - 'index.html'
      - 'app.js'
      - 'app-continuity-1497-1529-preview.js'
      - 'preview-continuity-1497-1529.html'
      - 'icon-gallery.html'
      - 'style.css'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate atlas data and static assets
        run: |
          # Collect all failing regressions while retaining the publication gate.
          failures=0
          python3 scripts/validate_atlas.py || { echo 'FAILED CHECK 1: python3 scripts/validate_atlas.py'; failures=$((failures+1)); }
          python3 scripts/validate_approved_ui.py || { echo 'FAILED CHECK 2: python3 scripts/validate_approved_ui.py'; failures=$((failures+1)); }
          python3 scripts/audit_spatial_semantics.py --strict --out /tmp/atlas-spatial-publish-audit.json || { echo 'FAILED CHECK 3: python3 scripts/audit_spatial_semantics.py --strict --out /tmp/atlas-spatial-publish-audit.json'; failures=$((failures+1)); }
          python3 scripts/audit_event_editorial_metadata.py --strict --out /tmp/atlas-editorial-metadata-publish-audit.json || { echo 'FAILED CHECK 4: python3 scripts/audit_event_editorial_metadata.py --strict --out /tmp/atlas-editorial-metadata-publish-audit.json'; failures=$((failures+1)); }
          node --check app.js || { echo 'FAILED CHECK 5: node --check app.js'; failures=$((failures+1)); }
          node --check js/history-stories.js || { echo 'FAILED CHECK 6: node --check js/history-stories.js'; failures=$((failures+1)); }
          node scripts/test_major_story_pilot.js || { echo 'FAILED CHECK 7: node scripts/test_major_story_pilot.js'; failures=$((failures+1)); }
          node scripts/test_multi_story_entries.js || { echo 'FAILED CHECK 8: node scripts/test_multi_story_entries.js'; failures=$((failures+1)); }
          node scripts/test_rut_kildare_major_stories.js || { echo 'FAILED CHECK 9: node scripts/test_rut_kildare_major_stories.js'; failures=$((failures+1)); }
          node scripts/test_tudor_governance_device_forts.js || { echo 'FAILED CHECK 10: node scripts/test_tudor_governance_device_forts.js'; failures=$((failures+1)); }
          node scripts/test_boulogne_kett_major_stories.js || { echo 'FAILED CHECK 11: node scripts/test_boulogne_kett_major_stories.js'; failures=$((failures+1)); }
          node scripts/test_western_prayerbook_guinea_stories.js || { echo 'FAILED CHECK 12: node scripts/test_western_prayerbook_guinea_stories.js'; failures=$((failures+1)); }
          node scripts/test_institutional_phase1.js || { echo 'FAILED CHECK 13: node scripts/test_institutional_phase1.js'; failures=$((failures+1)); }
          node scripts/test_marian_executions_1555_1556.js || { echo 'FAILED CHECK 14: node scripts/test_marian_executions_1555_1556.js'; failures=$((failures+1)); }
          node scripts/test_institutional_phase3.js || { echo 'FAILED CHECK 15: node scripts/test_institutional_phase3.js'; failures=$((failures+1)); }
