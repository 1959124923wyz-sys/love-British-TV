name: Editor41 5AG source-backed forts and settlement-site QA
on:
  pull_request:
    paths:
      - 'data/eighteenth-century-mass-schematic-zones-1700-1799.json'
      - 'data/eighteenth-century-editor41-5ag-localized-replacements.json'
      - 'scripts/test_editor41_5ag_localized_areas.js'
      - 'scripts/browser_editor41_5ag_localized_areas.cjs'
      - 'scripts/test_editor39_5ae_source_areas.js'
      - 'scripts/research_editor39_5ae_point_to_area_candidates.py'
      - '.github/workflows/editor41-5ag-source-areas.yml'
  push:
    branches: [main]
    paths:
      - 'data/eighteenth-century-mass-schematic-zones-1700-1799.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-borders-and-real-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 5AG two real alternatives for the large historic rectangles
        run: node scripts/test_editor41_5ag_localized_areas.js
      - name: Preserve 5AE original 23 GIS retirements and 5 promoted dated points
        run: |
          node scripts/test_editor39_5ae_source_areas.js
          node scripts/test_editor39_5ae_point_area_promotions.js
      - name: Ensure regenerating 77 point-site shortlist never resets the verified five
        run: |
          python3 scripts/research_editor39_5ae_point_to_area_candidates.py
          node scripts/test_editor41_5ag_localized_areas.js
      - name: Original mass archive and 5AB/5AC/5AD compatibility
        run: |
          node scripts/test_18c_mass_spatial_81_42.js
          node scripts/test_editor38_5ad_treaties_waterways.js
          node scripts/test_editor37_5ac_source_battlefields.js
          node scripts/test_editor37_5ab_source_geography.js
      - name: Strict political geography and decade boundary
        run: |
          python3 scripts/audit_spatial_semantics.py --strict
          python3 scripts/test_century_seam_handoffs.py
      - name: Visible history copy policy
        run: |
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Desktop map dated source footprints and 1705 Carolina control
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/5ag-map.log 2>&1 &
          node scripts/browser_editor41_5ag_localized_areas.cjs
