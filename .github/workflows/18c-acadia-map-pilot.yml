name: 18C Acadia desktop map preview smoke (unpublished)
on:
  push:
    branches:
      - map/18c-acadia-first-map-pilot-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node JavaScript syntax and 18C Acadia map-data contract
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_18c_acadia_map_pilot.js
          node scripts/test_editor7_17c_inline_story_map.js
          python3 -m json.tool data/stories/serial/chronology-preview-1700-1769.json >/dev/null
          python3 -m json.tool data/stories/serial/preview-18c-index.json >/dev/null
      - name: Strict historical GIS semantic audit
        run: python3 scripts/audit_spatial_semantics.py --strict
  desktop-browser:
    runs-on: ubuntu-latest
    needs: editorial-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Selenium
        run: python3 -m pip install --quiet selenium==4.28.1
      - name: Browser desktop 18C Acadia linked history and return
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/18c-acadia-http.log 2>&1 &
          python3 scripts/browser_18c_acadia_pilot.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-acadia-desktop-review-screenshots
          path: browser-smoke-results/
          if-no-files-found: ignore
