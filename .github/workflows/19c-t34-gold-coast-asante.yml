name: 19C T34 Gold Coast Asante wars gold plunder and land QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t34-gold-coast-asante-conquest-1844-1899.json'
      - 'docs/research/19C_T34_*'
      - 'research/19c/consolidated/T34*'
      - 'scripts/test_19c_t34_gold_coast_asante.cjs'
      - 'scripts/browser_19c_t34_gold_coast_asante.py'
      - '.github/workflows/19c-t34-gold-coast-asante.yml'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/e19-t34-gold-coast-asante-conquest-1844-1899.json'
permissions:
  contents: read
jobs:
  evidence-and-gis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_19c_t34_gold_coast_asante.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_serial_story_contract.js
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  desktop-real-chrome:
    needs: evidence-and-gis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t34.log 2>&1 &
          python3 scripts/browser_19c_t34_gold_coast_asante.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t34-asante-colonial-war-gis-desktop
          path: browser-smoke-results/19c-t34-*.png
          if-no-files-found: ignore
