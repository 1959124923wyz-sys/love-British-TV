name: 18C Australia First Fleet Indigenous dispossession and Pemulwuy map QA
on:
  push:
    branches:
      - map/18c-australia-first-fleet-resistance-20261108
  pull_request:
    branches:
      - map/18c-ireland-penal-rebellion-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-research-source-and-gis-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit sixth Australia and five previously source-backed major stories
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_18c_australia_map.js
          node scripts/test_18c_ireland_map.js
          node scripts/test_18c_atlantic_zong_map.js
          node scripts/test_18c_jamaica_maroon_map.js
          node scripts/test_18c_bengal_continuity_map.js
          node scripts/test_18c_acadia_map_pilot.js
          node scripts/test_editor7_17c_inline_story_map.js
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_australia_source_registry.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/stories/serial/chronology-preview-australia-1700-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t34-t35-australia-first-fleet-1717-1799.json >/dev/null
  actual-desktop-chromium:
    needs: original-research-source-and-gis-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Six long-form stories cross-year map panning and dossier return in real Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-australia-http.log 2>&1 &
          python3 scripts/browser_18c_australia_resistance.py
          python3 scripts/browser_18c_ireland_rebellion.py
          python3 scripts/browser_18c_atlantic_zong.py
          python3 scripts/browser_18c_jamaica_maroon.py
          python3 scripts/browser_18c_bengal_continuity.py
          python3 scripts/browser_18c_acadia_pilot.py
      - name: Preserve desktop map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-australia-first-fleet-pemulwuy-desktop-screenshots
          path: browser-smoke-results/
          if-no-files-found: ignore
