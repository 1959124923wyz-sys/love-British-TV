name: 19C T14 Sindh Punjab Awadh conquest and plunder QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t14-sindh-punjab-awadh-conquest-expropriation-1842-1859.json'
      - 'data/research/19c-t14-*'
      - 'docs/research/19C_T14_*'
      - 'research/19c/consolidated/T14*'
      - 'scripts/test_19c_t14_conquest_plunder.cjs'
      - 'scripts/browser_19c_t14_conquest_plunder.py'
      - '.github/workflows/19c-t14-conquest-plunder.yml'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/e19-t14-sindh-punjab-awadh-conquest-expropriation-1842-1859.json'
permissions:
  contents: read
jobs:
  fact-check-and-spatial-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_19c_t14_conquest_plunder.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_serial_story_contract.js
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  chrome-three-theatres:
    needs: fact-check-and-spatial-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t14.log 2>&1 &
          T14_PUBLISHED=1 python3 scripts/browser_19c_t14_conquest_plunder.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t14-conquest-plunder-desktop-map
          path: browser-smoke-results/19c-t14-*.png
          if-no-files-found: ignore
