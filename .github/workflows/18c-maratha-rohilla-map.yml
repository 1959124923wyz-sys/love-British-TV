name: 18C T18 Rohilla Maratha Awadh contracts archive GIS desktop QA
on:
  push:
    branches:
      - map/18c-maratha-rohilla-awadh-20261109
  pull_request:
    branches:
      - map/18c-mysore-wars-partition-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-nine-story-source-gis-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify T18 and all eight prior stories, complete ZIP, original B register and GIS
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_18c_maratha_rohilla_map.js
          node scripts/test_18c_mysore_map.js
          node scripts/test_18c_scotland_map.js
          node scripts/test_18c_australia_map.js
          node scripts/test_18c_ireland_map.js
          node scripts/test_18c_atlantic_zong_map.js
          node scripts/test_18c_jamaica_maroon_map.js
          node scripts/test_18c_bengal_continuity_map.js
          node scripts/test_18c_acadia_map_pilot.js
          node scripts/test_editor7_17c_inline_story_map.js
          node scripts/test_editor6_17c_spatial_batch01.js
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_maratha_source_registry.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/stories/serial/chronology-preview-maratha-rohilla-awadh-1700-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t18-maratha-rohilla-awadh-1773-1782.json >/dev/null
          python3 -m json.tool research/continuity/1773-1782-maratha-awadh/MULTI_ACTOR_CONTROL_EPISODES.json >/dev/null
  actual-desktop-chromium:
    needs: full-nine-story-source-gis-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Real T18 desktop, historical story map source links and eight earlier browser regressions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-maratha-http.log 2>&1 &
          python3 scripts/browser_18c_maratha_rohilla_awadh.py
          python3 scripts/browser_18c_mysore_wars.py
          python3 scripts/browser_18c_scotland_union.py
          python3 scripts/browser_18c_australia_resistance.py
          python3 scripts/browser_18c_ireland_rebellion.py
          python3 scripts/browser_18c_atlantic_zong.py
          python3 scripts/browser_18c_jamaica_maroon.py
          python3 scripts/browser_18c_bengal_continuity.py
          python3 scripts/browser_18c_acadia_pilot.py
      - name: Upload real historic map browser proof and error screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-maratha-rohilla-awadh-1773-1782-desktop-screenshots
          path: browser-smoke-results/
          if-no-files-found: ignore
  review-web-preview:
    needs: full-nine-story-source-gis-contract
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Verify static branch preview exists at external raw.githack.com and records respond
        run: |
          set -e
          BASE="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}"
          curl --fail --location --retry 3 --retry-delay 3 --max-time 25 --silent --show-error "$BASE/index.html" -o /tmp/t18-preview.html
          curl --fail --location --retry 3 --retry-delay 3 --max-time 25 --silent --show-error "$BASE/data/stories/serial/chronology-preview-maratha-rohilla-awadh-1700-1799.json" -o /tmp/t18-source.json
          grep -q '帝国的代价' /tmp/t18-preview.html
          grep -q 'E18C-MRA-1781-BENARES-CHAIT-SINGH' /tmp/t18-source.json
          echo "REVIEW_WEB_URL=$BASE/index.html?review18c=1&year=1781"
