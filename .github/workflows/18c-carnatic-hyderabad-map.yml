name: 18C T19 Carnatic Hyderabad Kattabomman documentary map QA
on:
  push:
    branches:
      - map/18c-carnatic-hyderabad-kattabomman-20261110
  pull_request:
    branches:
      - map/18c-maratha-rohilla-awadh-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ten-story-source-geometry-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify new T19, first nine research stories, 17C integrity and strict GIS
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_18c_carnatic_hyderabad_map.js
          node scripts/test_18c_maratha_rohilla_map.js
          node scripts/test_18c_mysore_map.js
          node scripts/test_18c_scotland_map.js
          node scripts/test_18c_australia_map.js
          node scripts/test_18c_ireland_map.js
          node scripts/test_18c_atlantic_zong_map.js
          node scripts/test_18c_jamaica_maroon_map.js
          node scripts/test_18c_bengal_continuity_map.js
          node scripts/test_18c_acadia_map_pilot.js
          node scripts/test_editor7_17c_inline_story_map.js
          node scripts/test_editor6_17c_spatial_batch01.js
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_carnatic_source_registry.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/stories/serial/chronology-preview-carnatic-hyderabad-1700-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t19-carnatic-hyderabad-palayakkarar-1746-1799.json >/dev/null
          python3 -m json.tool research/continuity/1746-1799-carnatic/ACTOR_TREATY_CONTROL_DISPOSITIONS.json >/dev/null
  real-desktop-chromium:
    needs: ten-story-source-geometry-archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Live 1780x1020 T19 war, legal geography and nine previous desktop map regressions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-carnatic-http.log 2>&1 &
          python3 scripts/browser_18c_carnatic_hyderabad.py
          python3 scripts/browser_18c_maratha_rohilla_awadh.py
          python3 scripts/browser_18c_mysore_wars.py
          python3 scripts/browser_18c_scotland_union.py
          python3 scripts/browser_18c_australia_resistance.py
          python3 scripts/browser_18c_ireland_rebellion.py
          python3 scripts/browser_18c_atlantic_zong.py
          python3 scripts/browser_18c_jamaica_maroon.py
          python3 scripts/browser_18c_bengal_continuity.py
          python3 scripts/browser_18c_acadia_pilot.py
      - name: Store ten-story Chrome evidence images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-carnatic-hyderabad-kattabomman-1746-1799-screenshots
          path: browser-smoke-results/
          if-no-files-found: ignore
  external-review-html-check:
    needs: ten-story-source-geometry-archive
    runs-on: ubuntu-latest
    steps:
      - name: Ensure tenth preview map, JS, CSS, new Atlas JSON and long story load from static GitHub proxy
        run: |
          set -e
          BASE="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}"
          for path in index.html app.js js/history-stories.js style.css data/stories/serial/preview-18c-index.json data/stories/serial/chronology-preview-carnatic-hyderabad-1700-1799.json data/stories/serial/e18-t19-carnatic-hyderabad-palayakkarar-1746-1799.json; do
            curl --fail --location --retry 3 --retry-delay 3 --max-time 30 --silent --show-error "$BASE/$path" -o "/tmp/t19-$(basename "$path")"
          done
          grep -q '帝国的代价' /tmp/t19-index.html
          grep -q 'E18C-CKT-1798-HYDERABAD-SUBSIDIARY-TREATY' /tmp/t19-chronology-preview-carnatic-hyderabad-1700-1799.json
          grep -q 'E18-T19-CARNATIC-HYDERABAD-PALAYAKKARAR-1746-1799' /tmp/t19-preview-18c-index.json
          echo "TENTH_PREVIEW_URL=$BASE/index.html?review18c=1&year=1798"
