name: Cross-century story contract
on:
  pull_request:
    paths:
      - 'js/history-stories.js'
      - 'data/stories/serial/**'
      - 'scripts/test_serial_story_contract.js'
      - 'data/chapters.json'
      - '.github/workflows/serial-story-contract.yml'
  push:
    branches:
      - 'release/editor6-glencoe-story-preview-20261019'
    paths:
      - 'js/history-stories.js'
      - 'data/stories/serial/**'
      - 'scripts/test_serial_story_contract.js'
      - 'data/chapters.json'
      - '.github/workflows/serial-story-contract.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check js/history-stories.js
      - run: node scripts/test_serial_story_contract.js
      - run: node scripts/test_major_story_pilot.js
