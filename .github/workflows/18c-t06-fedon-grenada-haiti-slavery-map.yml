  public-draft-web-preview:
    needs: nineteen-story-source-GIS-and-reader
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub branch static preview HTML JS CSS Atlas datasets and long story via external proxy
        run: |
          set -e
          BASE="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}"
          for path in index.html app.js js/history-stories.js css/history-stories.css data/stories/serial/preview-18c-index.json data/stories/serial/chronology-preview-fedon-grenada-haiti-1789-1798.json data/stories/serial/e18-t06-fedon-grenada-haiti-colonial-repression-1789-1798.json; do
            curl --fail --location --retry 3 --retry-delay 3 --max-time 30 --silent --show-error "$BASE/$path" -o "/tmp/t06-$(basename "$path")"
          done
          grep -q '帝国的代价' /tmp/t06-index.html
          grep -q 'E18C-FED-1796-JUN7-ENSLAVED-REBEL-LAW' /tmp/t06-chronology-preview-fedon-grenada-haiti-1789-1798.json
          grep -q 'E18-T06-FEDON-GRENADA-HAITI-BRITISH-REPRESSION-1789-1798' /tmp/t06-preview-18c-index.json
          if grep -q 'story-reading-toolbar' /tmp/t06-history-stories.js; then echo 'BUG: deleted dynamic TOC still present'; exit 1; fi
          echo "FEDON_HAITI_REVIEW_URL=$BASE/index.html?review18c=1&year=1795"
