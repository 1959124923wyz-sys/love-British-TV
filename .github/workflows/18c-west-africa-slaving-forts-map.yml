name: 18C T26 West Africa British slave trade forts law and colonial violence QA
on:
  push:
    branches:
      - map/18c-west-africa-enslavement-forts-1750-1795-20261110
  pull_request:
    branches:
      - map/18c-cape-1795-khoekhoe-xhosa-resistance-1799-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thirteen-story-source-GIS-and-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify T26 all original 13 source IDs, 20 B refs, 21 dated events, prior 12 stories and strict GIS
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_major_story_pilot.js
          node scripts/test_18c_west_africa_slaving_map.js
          node scripts/test_18c_cape_khoekhoe_xhosa_map.js
          node scripts/test_18c_manila_sack_map.js
          node scripts/test_18c_carnatic_hyderabad_map.js
          node scripts/test_18c_maratha_rohilla_map.js
          node scripts/test_18c_mysore_map.js
          node scripts/test_18c_scotland_map.js
          node scripts/test_18c_australia_map.js
          node scripts/test_18c_ireland_map.js
          node scripts/test_18c_atlantic_zong_map.js
          node scripts/test_18c_jamaica_maroon_map.js
          node scripts/test_18c_bengal_continuity_map.js
          node scripts/test_18c_acadia_map_pilot.js
          node scripts/test_editor7_17c_inline_story_map.js
          node scripts/test_editor6_17c_spatial_batch01.js
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_west_africa_source_registry.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/stories/serial/chronology-preview-west-africa-enslavement-1700-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t26-west-africa-slaving-forts-laws-1727-1795.json >/dev/null
          python3 -m json.tool research/continuity/1727-1795-west-africa/BRITISH_SLAVING_FORTS_AND_LAW_ACTOR_TRANSITIONS.json >/dev/null
  actual-thirteen-story-desktop-chromium:
    needs: thirteen-story-source-GIS-and-reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Real 1780x1020 T26 slave trade, forts, 1758 control and 1791 failure plus all 12 previous browser checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-west-africa-http.log 2>&1 &
          python3 scripts/browser_18c_west_africa_slaving.py
          python3 scripts/browser_18c_cape_khoekhoe_xhosa.py
          python3 scripts/browser_18c_manila_sack.py
          python3 scripts/browser_18c_carnatic_hyderabad.py
          python3 scripts/browser_18c_maratha_rohilla_awadh.py
          python3 scripts/browser_18c_mysore_wars.py
          python3 scripts/browser_18c_scotland_union.py
          python3 scripts/browser_18c_australia_resistance.py
          python3 scripts/browser_18c_ireland_rebellion.py
          python3 scripts/browser_18c_atlantic_zong.py
          python3 scripts/browser_18c_jamaica_maroon.py
          python3 scripts/browser_18c_bengal_continuity.py
          python3 scripts/browser_18c_acadia_pilot.py
          python3 scripts/browser_major_story_pilot.py
      - name: Upload real desktop evidence and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-west-africa-british-slaving-forts-and-laws-desktop
          path: |
            browser-smoke-results/
            story-pilot-browser-results/
          if-no-files-found: ignore
  public-history-review-web-preview:
    needs: thirteen-story-source-GIS-and-reader
    runs-on: ubuntu-latest
    steps:
      - name: Ensure externally hosted static HTML JS CSS research source JSON and full article are reachable
        run: |
          set -e
          BASE="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}"
          for path in index.html app.js js/history-stories.js css/history-stories.css data/stories/serial/preview-18c-index.json data/stories/serial/chronology-preview-west-africa-enslavement-1700-1799.json data/stories/serial/e18-t26-west-africa-slaving-forts-laws-1727-1795.json; do
            curl --fail --location --retry 3 --retry-delay 3 --max-time 30 --silent --show-error "$BASE/$path" -o "/tmp/t26-$(basename "$path")"
          done
          grep -q '帝国的代价' /tmp/t26-index.html
          grep -q 'E18C-WAF-1750-CASTLE-SLAVES-TREATED-AS-PROPERTY' /tmp/t26-chronology-preview-west-africa-enslavement-1700-1799.json
          grep -q 'E18-T26-WEST-AFRICAN-SLAVING-FORTS-LAWS-1727-1795' /tmp/t26-preview-18c-index.json
          if grep -q 'story-reading-toolbar' /tmp/t26-history-stories.js; then echo 'Removed chapter navigation still present'; exit 1; fi
          echo "WEST_AFRICA_REVIEW_URL=$BASE/index.html?review18c=1&year=1750"
