name: 19C T01-T03 Caribbean and global plantation labour GIS
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t0[123]-*.json'
      - 'docs/research/19C_T0[123]_*'
      - 'data/stories/serial/index.json'
      - 'research/19c/consolidated/T0[123]*'
      - 'scripts/test_19c_t01_t02_t03_labour.cjs'
      - 'scripts/browser_19c_t01_t02_t03_labour.py'
      - '.github/workflows/19c-t01-t02-t03-labour.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  primary-source-and-gis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 82 links 58 new 22 GIS points and immutable archive
        run: |
          node --check scripts/test_19c_t01_t02_t03_labour.cjs
          node scripts/test_19c_t01_t02_t03_labour.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_serial_story_contract.js
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  independent-true-desktop-chrome:
    needs: primary-source-and-gis
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-labour.log 2>&1 &
          python3 scripts/browser_19c_t01_t02_t03_labour.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t01-t02-t03-independent-chrome
          path: browser-smoke-results/19c-t0*.png
          if-no-files-found: ignore
