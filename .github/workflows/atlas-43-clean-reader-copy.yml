name: Atlas reader copy clean no academic map disclaimers
on:
  push:
    branches:
      - ux/atlas-43-clean-reader-copy-simplify-overlap-20261112
  pull_request:
    branches:
      - ux/atlas-1497-1699-right-overlap-glow-scaleout-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-reader-static-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Original evidence and all chapter code still valid; UI drafting notes removed
        run: |
          for file in app.js js/atlas-reader-copy.js js/eighteenth-overlap-right-dossier.js js/historic-overlap-dossier-1497-1699.js js/eighteenth-mass-spatial.js js/eighteenth-dynamic-spatial.js js/eighteenth-batch36-spatial.js js/eighteenth-batch37-spatial.js js/eighteenth-batch38-spatial.js js/eighteenth-batch39-spatial.js; do node --check "$file"; done
          python3 -m py_compile scripts/browser_atlas_clean_reader_copy.py scripts/browser_historic_overlap_1497_1699.py scripts/browser_18c_right_overlap_hover.py scripts/browser_editor23_expansive_17c_claims.py
          node scripts/test_reader_clean_copy_1497_1799.js
          node scripts/test_historic_overlap_1497_1699.js
          node scripts/test_18c_right_overlap_hover.js
          node scripts/test_editor23_expansive_17c_claims.js
          node scripts/test_18c_batch39_126_83.js
          node scripts/test_editor7_17c_regional_studies.js
          node scripts/test_shared_territorial_geometries.js
          python3 scripts/audit_spatial_semantics.py --strict
  clean-reader-real-desktop:
    needs: clean-reader-static-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Clean concise copy and real hover glow on original 16 17 18-century maps
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-clean-reader-http.log 2>&1 &
          python3 scripts/browser_atlas_clean_reader_copy.py
          python3 scripts/browser_historic_overlap_1497_1699.py
          python3 scripts/browser_18c_right_overlap_hover.py
          python3 scripts/browser_editor23_expansive_17c_claims.py
          python3 scripts/browser_18c_batch39_126_83.py
          python3 scripts/browser_desktop_layer_timeline.py
      - name: Save 1780x1020 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-reader-clean-copy-desktop-proof
          path: browser-smoke-results/
          if-no-files-found: ignore
  clean-reader-public-fixed-sha:
    needs: clean-reader-static-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify public SHA-pinned revised UI and original research
        run: |
          set -eu
          BASE="https://raw.githack.com/$GITHUB_REPOSITORY/$GITHUB_SHA"
          for f in index.html app.js js/atlas-reader-copy.js js/eighteenth-overlap-right-dossier.js js/historic-overlap-dossier-1497-1699.js css/eighteenth-overlap-right-dossier.css data/eighteenth-century-mass-schematic-zones-1700-1799.json data/seventeenth-century-expansive-colonial-claims-1600-1699.geojson; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --output /dev/null "$BASE/$f"
          done
