name: 20C T002 land revenue publication QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/e20-t002-india-land-revenue-1900-1947.json'
      - 'data/stories/serial/index.json'
      - 'data/stories/serial/chronology-19*.json'
      - 'data/twentieth-century-spatial-*.geojson'
      - 'scripts/test_20c_t002.cjs'
      - 'scripts/browser_20c_t002.py'
      - '.github/workflows/20c-t002.yml'
permissions:
  contents: read
jobs:
  evidence-and-gis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_20c_t002.cjs
          node scripts/test_serial_story_contract.js
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  desktop-history-and-map:
    needs: evidence-and-gis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t002.log 2>&1 &
          python3 scripts/browser_20c_t002.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 20c-t002-map
          path: browser-smoke-results/20c-t002-*.png
          if-no-files-found: ignore
