name: 20C T068 Caribbean labour and colonial policing evidence and desktop QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/**'
      - 'data/twentieth-century-spatial-*.geojson'
      - 'research/20c/T068*'
      - 'scripts/test_20c_t068.cjs'
      - 'scripts/browser_20c_t068.py'
      - '.github/workflows/20c-t068.yml'
permissions:
  contents: read
jobs:
  evidence-and-gis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_20c_t068.cjs
          node scripts/test_serial_story_contract.js
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_atlas_47_public_copy_guard.js
  desktop-history:
    needs: evidence-and-gis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t068.log 2>&1 &
          python3 scripts/browser_20c_t068.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 20c-t068-desktop
          path: browser-smoke-results/*.png
          if-no-files-found: ignore
