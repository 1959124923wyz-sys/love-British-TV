name: Major history story reader pilot QA
on:
  pull_request:
    branches: [main]
    paths:
      - "data/stories/**"
      - "data/atlas-1497-1509.json"
      - "data/atlas-1510-1519.json"
      - "scripts/test_first_group_history_stories.js"
      - "scripts/browser_first_group_stories.py"
      - "data/atlas-1520-1529.json"
      - "data/atlas-1530-1539.json"
      - "scripts/test_rut_kildare_major_stories.js"
      - "scripts/test_tudor_governance_device_forts.js"
      - "scripts/browser_tudor_device_forts.py"
      - "scripts/test_boulogne_kett_major_stories.js"
      - "scripts/browser_boulogne_kett_stories.py"
      - "scripts/browser_western_prayerbook_guinea_stories.py"
      - "scripts/test_western_prayerbook_guinea_stories.js"
      - "scripts/test_munster_essex_story_1569_1575.js"
      - "scripts/test_drake_sidney_frobisher_major_stories.js"
      - "scripts/test_snake_e_01_drake_sidney_supplement.js"
      - "scripts/test_frobisher_drake_stories_1576_1580.js"
      - "scripts/browser_frobisher_drake_stories.py"
      - "scripts/browser_snake_e_36_39_stories.py"
      - "scripts/browser_snake_e_44_45.py"
      - "scripts/test_snake_e03_stories.py"
      - "scripts/test_snake_e_44_45.js"
      - "data/atlas-1580-1589.json"
      - "scripts/browser_drake_sidney_frobisher_stories.py"
      - "scripts/browser_munster_essex_stories.py"
      - "data/atlas-1560-1569.json"
      - "data/atlas-1570-1579.json"
      - "data/century-violence-regions-1544-1589.geojson"
      - "data/atlas-1550-1559.json"
      - "data/war-front-corridors-1540-1549.geojson"
      - "data/historical-detail-notes.json"
      - "data/atlas-1530-1539.json"
      - "scripts/browser_rut_kildare_stories.py"
      - "scripts/test_tournai_surrey_major_stories.js"
      - "scripts/browser_tournai_surrey_stories.py"
      - "data/atlas-1540-1549.json"
      - "scripts/test_scots_calais_stories.js"
      - "scripts/browser_scots_calais_stories.py"
      - "data/atlas-1540-1549.json"
      - "data/early-war-colonial-impact-1544-1575.geojson"
      - "data/war-front-corridors-1540-1549.geojson"
      - "scripts/test_rough_wooing_cartography.js"
      - "js/history-stories.js"
      - "css/history-stories.css"
      - "scripts/test_major_story_pilot.js"
      - "scripts/browser_major_story_pilot.py"
      - "scripts/browser_rough_wooing_story.py"
      - "app.js"
      - "index.html"
      - ".github/workflows/major-history-stories.yml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate article, source links and JavaScript
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_major_story_pilot.js
          node scripts/test_rut_kildare_major_stories.js
          node scripts/test_tudor_governance_device_forts.js
          node scripts/test_boulogne_kett_major_stories.js
          node scripts/test_western_prayerbook_guinea_stories.js
          node scripts/test_munster_essex_story_1569_1575.js
          node scripts/test_drake_sidney_frobisher_major_stories.js
          node scripts/test_snake_e_01_drake_sidney_supplement.js
          node scripts/test_frobisher_drake_stories_1576_1580.js
          python3 scripts/test_snake_e03_stories.py
          node scripts/test_snake_e_44_45.js
          node scripts/test_first_group_history_stories.js
          node scripts/test_tournai_surrey_major_stories.js
          node scripts/test_scots_calais_stories.js
          node scripts/test_rough_wooing_cartography.js
      - name: Test real reading and map behavior in Chromium
        run: |
          pip install selenium
          python -m http.server 8765 &
          python scripts/browser_major_story_pilot.py
          python scripts/browser_rough_wooing_story.py
          python scripts/browser_first_group_stories.py
          python scripts/browser_tournai_surrey_stories.py
          python scripts/browser_scots_calais_stories.py
          python scripts/browser_rut_kildare_stories.py
          python scripts/browser_tudor_device_forts.py
          python scripts/browser_boulogne_kett_stories.py
          python scripts/browser_western_prayerbook_guinea_stories.py
          python scripts/browser_munster_essex_stories.py
          python scripts/browser_drake_sidney_frobisher_stories.py
          python scripts/browser_frobisher_drake_stories.py
          python scripts/browser_snake_e_36_39_stories.py
          python scripts/browser_snake_e_44_45.py
      - name: Keep screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-story-browser-screenshots
          path: |
            story-pilot-browser-results/
            rough-wooing-browser-results/
            first-group-major-story-browser-evidence/
            tournai-surrey-browser-results/
            scots-calais-browser-results/
            rut-kildare-browser-results/
            tudor-forts-browser-results/
            boulogne-kett-browser-results/
            prayerbook-guinea-browser-results/
            ireland-1569-1575-browser-results/
            drake-sidney-frobisher-browser-results/
            frobisher-drake-browser-results/
            snake-e-36-39-browser-results/
            snake-e-44-45-browser-results/
