name: Editor7 Jamaica Conquest and Maroon Resistance Tudor Story QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/**'
      - 'data/atlas-1650-1659.json'
      - 'data/atlas-1660-1669.json'
      - 'data/atlas-1670-1679.json'
      - 'data/atlas-1680-1689.json'
      - 'data/atlas-1690-1699.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/seventeenth-century-regional-studies-1600-1699.geojson'
      - 'scripts/test_editor7_jamaica_maroon_story.js'
      - 'scripts/browser_editor7_jamaica_maroon_story.py'
      - '.github/workflows/editor7-jamaica-maroon-story.yml'
      - 'app.js'
      - 'js/history-stories.js'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/**'
      - 'data/atlas-1650-1659.json'
      - 'data/atlas-1660-1669.json'
      - 'data/atlas-1670-1679.json'
      - 'data/atlas-1680-1689.json'
      - 'data/atlas-1690-1699.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/seventeenth-century-regional-studies-1600-1699.geojson'
      - 'scripts/test_editor7_jamaica_maroon_story.js'
      - 'scripts/browser_editor7_jamaica_maroon_story.py'
      - 'app.js'
      - 'js/history-stories.js'
jobs:
  jamaica-source-and-land-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate new Jamaica narrative and legal records
        run: |
          node --check scripts/test_editor7_jamaica_maroon_story.js
          node scripts/test_editor7_jamaica_maroon_story.js
          node scripts/test_serial_story_contract.js
          node scripts/test_17c_tudor_parity_20261023.js
          python3 scripts/audit_spatial_semantics.py --strict
      - name: Install Selenium for desktop Chromium
        run: pip install selenium
      - name: Check actual year jumps and dossier return
        run: |
          python -m http.server 8765 &
          python scripts/browser_editor7_jamaica_maroon_story.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor7-jamaica-maroon-browser-proof
          path: browser-smoke-results/editor7-jamaica-*.png
