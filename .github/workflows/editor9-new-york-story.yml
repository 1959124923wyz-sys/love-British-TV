name: Editor9 New Netherland and New York Tudor Story QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/**'
      - 'data/atlas-1640-1649.json'
      - 'data/atlas-1660-1669.json'
      - 'data/atlas-1670-1679.json'
      - 'data/atlas-1680-1689.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/seventeenth-century-regional-studies-1600-1699.geojson'
      - 'scripts/test_editor9_new_york_story.js'
      - 'scripts/browser_editor9_new_york_story.py'
      - '.github/workflows/editor9-new-york-story.yml'
      - 'app.js'
      - 'js/history-stories.js'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/**'
      - 'data/atlas-1640-1649.json'
      - 'data/atlas-1660-1669.json'
      - 'data/atlas-1670-1679.json'
      - 'data/atlas-1680-1689.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/seventeenth-century-regional-studies-1600-1699.geojson'
      - 'scripts/test_editor9_new_york_story.js'
      - 'scripts/browser_editor9_new_york_story.py'
      - 'app.js'
      - 'js/history-stories.js'
jobs:
  new-york-history-map-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 17C long history, source, nonmetric GIS and 16C parity
        run: |
          node --check scripts/test_editor9_new_york_story.js
          node scripts/test_editor9_new_york_story.js
          node scripts/test_serial_story_contract.js
          node scripts/test_17c_tudor_parity_20261023.js
          node scripts/test_editor7_17c_inline_story_map.js
          node scripts/test_editor7_17c_regional_studies.js
          node scripts/test_editor6_17c_georeference_r02.js
          python3 scripts/audit_spatial_semantics.py --strict
      - name: Install selenium
        run: pip install selenium
      - name: Real desktop browser and return navigation test
        run: |
          python -m http.server 8765 &
          python scripts/browser_editor9_new_york_story.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor9-new-york-desktop-proof
          path: browser-smoke-results/editor9-ny-*.png
