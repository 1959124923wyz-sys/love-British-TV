name: 19C T33 West Africa colonial wars and plunder evidence GIS
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t33-lagos-niger-benin-conquest-1851-1899.json'
      - 'docs/research/19C_T33_*'
      - 'research/19c/consolidated/T33*'
      - 'scripts/test_19c_t33_west_africa.cjs'
      - 'scripts/browser_19c_t33_west_africa.py'
      - '.github/workflows/19c-t33-west-africa.yml'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/e19-t33-lagos-niger-benin-conquest-1851-1899.json'
permissions:
  contents: read
jobs:
  source-and-spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_19c_t33_west_africa.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_serial_story_contract.js
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  desktop-real-chrome:
    needs: source-and-spatial
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t33.log 2>&1 &
          python3 scripts/browser_19c_t33_west_africa.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t33-west-africa-colonial-evidence-map
          path: browser-smoke-results/19c-t33-*.png
          if-no-files-found: ignore
