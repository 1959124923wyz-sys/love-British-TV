name: Editor11 Navigation Acts Anglo-Dutch Wars 17C Tudor-style Desktop QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/**'
      - 'data/atlas-1650-1659.json'
      - 'data/atlas-1660-1669.json'
      - 'data/atlas-1670-1679.json'
      - 'data/atlas-1680-1689.json'
      - 'data/atlas-1690-1699.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/seventeenth-century-regional-studies-1600-1699.geojson'
      - 'scripts/test_editor11_navigation_story.js'
      - 'scripts/browser_editor11_navigation_story.py'
      - '.github/workflows/editor11-navigation-story.yml'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/**'
      - 'data/atlas-1650-1659.json'
      - 'data/atlas-1660-1669.json'
      - 'data/atlas-1670-1679.json'
      - 'data/atlas-1680-1689.json'
      - 'data/atlas-1690-1699.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/seventeenth-century-regional-studies-1600-1699.geojson'
      - 'scripts/test_editor11_navigation_story.js'
      - 'scripts/browser_editor11_navigation_story.py'
jobs:
  source-claims-year-slider-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check official sources story links and nonmetric map
        run: |
          node --check scripts/test_editor11_navigation_story.js
          node scripts/test_editor11_navigation_story.js
          node scripts/test_serial_story_contract.js
          node scripts/test_17c_tudor_parity_20261023.js
          node scripts/test_editor7_17c_inline_story_map.js
          node scripts/test_editor7_17c_regional_studies.js
          node scripts/test_editor6_17c_batch01.js
          node scripts/test_editor6_17c_georeference_r02.js
          python3 scripts/audit_spatial_semantics.py --strict
      - name: Install headless desktop browser
        run: pip install selenium
      - name: Run 1780px year slider map pan dossier return
        run: |
          python -m http.server 8765 &
          python scripts/browser_editor11_navigation_story.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor11-navigation-desktop-proof
          path: browser-smoke-results/editor11-nav-*.png
