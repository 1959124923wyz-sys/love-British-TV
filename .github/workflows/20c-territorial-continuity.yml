name: 20C historical territory continuity and real desktop gate
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'style.css'
      - 'data/twentieth-century-*.geojson'
      - 'data/cshapes-20c/**'
      - 'data/stories/serial/chronology-19*.json'
      - 'tests/check-20c-territorial-continuity.py'
      - 'scripts/browser_20c_territorial_continuity.py'
      - '.github/workflows/20c-territorial-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'style.css'
      - 'data/twentieth-century-*.geojson'
      - 'data/cshapes-20c/**'
      - 'data/stories/serial/chronology-19*.json'
      - 'tests/check-20c-territorial-continuity.py'
      - 'scripts/browser_20c_territorial_continuity.py'
      - '.github/workflows/20c-territorial-continuity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-year-territory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dated features, sources and syntax
        run: |
          node --check app.js
          python3 tests/check-20c-territorial-continuity.py
          python3 -m py_compile scripts/browser_20c_territorial_continuity.py
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Verify every year actually renders all expected features in desktop Chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas20c-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          python3 scripts/browser_20c_territorial_continuity.py
      - name: Keep year-by-year and area-click screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas20c-territorial-desktop-proof
          path: |
            browser-smoke-results/
            /tmp/atlas20c-http.log
          if-no-files-found: ignore
