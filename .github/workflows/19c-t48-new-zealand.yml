name: 19C T48 New Zealand Maori wars land confiscation QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t48-new-zealand-maori-confiscation-1840-1883.json'
      - 'docs/research/19C_T48_*'
      - 'research/19c/consolidated/T48*'
      - 'scripts/test_19c_t48_new_zealand.cjs'
      - 'scripts/browser_19c_t48_new_zealand.py'
      - '.github/workflows/19c-t48-new-zealand.yml'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/e19-t48-new-zealand-maori-confiscation-1840-1883.json'
permissions:
  contents: read
jobs:
  evidence-and-gis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_19c_t48_new_zealand.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_serial_story_contract.js
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  desktop-history-and-map:
    needs: evidence-and-gis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t48.log 2>&1 &
          python3 scripts/browser_19c_t48_new_zealand.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t48-new-zealand-colonial-map
          path: browser-smoke-results/19c-t48-*.png
          if-no-files-found: ignore
