name: 18C T33 Scotland slavery Court of Session freedom 31-topic historical GIS QA
on:
  push:
    branches:
      - map/18c-t33-scotland-slavery-investment-court-resistance-1707-1792-20261111
  pull_request:
    branches:
      - map/18c-t28-havana-falklands-malta-short-occupations-1762-1799-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thirtyone-story-source-GIS-and-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check 31 research stories, T33 0 prior archives, 29 real litigations and strict GIS
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_major_story_pilot.js
          for test in scripts/test_18c_*.js; do node "$test"; done
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_t33_empty_predecessor_sources.py
          python3 scripts/audit_18c_t28_original_B_sources.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/stories/serial/chronology-preview-t33-scotland-slavery-courts-1707-1792.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t33-scotland-slavery-courts-1707-1792.json >/dev/null
          python3 -m json.tool research/continuity/1707-1792-scotland-slavery-courts/T33_ARCHIVAL_CAPITAL_FREEDOM_LEGAL_LEDGER.json >/dev/null
  real-desktop-chromium:
    needs: thirtyone-story-source-GIS-and-reader
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Real desktop 1780x1020 T33, all 30 predecessor 18C stories and published Tudor regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c31-http.log 2>&1 &
          python3 scripts/browser_18c_t33_scotland_slavery_courts.py
          for browser_test in scripts/browser_18c_*.py; do
            if [ "$browser_test" != "scripts/browser_18c_t33_scotland_slavery_courts.py" ]; then
              python3 "$browser_test"
            fi
          done
          python3 scripts/browser_major_story_pilot.py
      - name: Preserve all desktop Chromium screenshots from Scotland and first 30 stories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c31-scotland-slavery-courts-freedom-archival-desktop-screenshots
          path: |
            browser-smoke-results/
            story-pilot-browser-results/
          if-no-files-found: ignore
  public-draft-web-preview:
    needs: thirtyone-story-source-GIS-and-reader
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Independently load SHA-bound static research website, T33 and previous two studies
        run: |
          set -eu
          BASE="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}"
          for path in index.html app.js js/history-stories.js css/history-stories.css data/stories/serial/preview-18c-index.json data/stories/serial/chronology-preview-t33-scotland-slavery-courts-1707-1792.json data/stories/serial/e18-t33-scotland-slavery-courts-1707-1792.json data/stories/serial/chronology-preview-t28-havana-egmont-malta-1762-1799.json data/stories/serial/e18-t28-havana-egmont-malta-1762-1799.json data/stories/serial/chronology-preview-t23-penang-kedah-moluccas-1768-1796.json data/stories/serial/e18-t23-penang-kedah-andaman-ambon-banda-1768-1796.json; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --output /dev/null "$BASE/$path"
          done
