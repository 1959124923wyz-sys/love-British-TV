    needs: twentyone-story-source-GIS-and-reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: 1780x1020 indigenous captivity, Tuscarora fort burning, Yamasee revolt, 20 older stories plus 16C
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-cape-http.log 2>&1 &
          python3 scripts/browser_18c_t09_tuscarora_yamasee.py
          python3 scripts/browser_18c_t11_slavery_law_resistance.py
          python3 scripts/browser_18c_fedon_grenada_haiti.py
          python3 scripts/browser_18c_garifuna_exile.py
