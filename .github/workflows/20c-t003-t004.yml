name: 20C T003 T004 Bengal Punjab publication QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/e20-t003-bengal-partition-detention-1905-1919.json'
      - 'data/stories/serial/e20-amritsar-massacre-1910-1919.json'
      - 'data/stories/serial/index.json'
      - 'scripts/test_20c_t003_t004.cjs'
      - 'scripts/browser_20c_t003_t004.py'
      - '.github/workflows/20c-t003-t004.yml'
permissions:
  contents: read
jobs:
  evidence-and-gis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_20c_t003_t004.cjs
          node scripts/test_serial_story_contract.js
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  desktop-history-and-map:
    needs: evidence-and-gis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t003-t004.log 2>&1 &
          python3 scripts/browser_20c_t003_t004.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 20c-t003-t004-map
          path: browser-smoke-results/*.png
          if-no-files-found: ignore
