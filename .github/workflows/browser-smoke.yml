name: Desktop atlas browser smoke
on:
  pull_request:
    paths:
      - "scripts/browser_smoke.py"
      - "scripts/browser_desktop_layer_timeline.py"
      - "app.js"
      - "index.html"
      - "js/*.js"
      - "css/*.css"
      - ".github/workflows/browser-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/browser_smoke.py"
      - "scripts/browser_desktop_layer_timeline.py"
      - "app.js"
      - "index.html"
      - "js/*.js"
      - "css/*.css"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser testing library
        run: pip install selenium
      - name: Serve the local atlas and execute browser checks
        run: |
          python -m http.server 8765 &
          python scripts/browser_smoke.py
          python scripts/browser_desktop_layer_timeline.py
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-map-screenshots
          path: browser-smoke-results/
