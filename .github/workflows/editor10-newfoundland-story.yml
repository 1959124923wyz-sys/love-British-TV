name: Editor10 Newfoundland Beothuk Fishery Colonial Warfare Tudor Story QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/**'
      - 'data/atlas-1610-1619.json'
      - 'data/atlas-1620-1629.json'
      - 'data/atlas-1630-1639.json'
      - 'data/atlas-1650-1659.json'
      - 'data/atlas-1660-1669.json'
      - 'data/atlas-1670-1679.json'
      - 'data/atlas-1690-1699.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/seventeenth-century-regional-studies-1600-1699.geojson'
      - 'scripts/test_editor10_newfoundland_story.js'
      - 'scripts/browser_editor10_newfoundland_story.py'
      - '.github/workflows/editor10-newfoundland-story.yml'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/**'
      - 'data/atlas-1610-1619.json'
      - 'data/atlas-1690-1699.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/seventeenth-century-regional-studies-1600-1699.geojson'
      - 'scripts/test_editor10_newfoundland_story.js'
      - 'scripts/browser_editor10_newfoundland_story.py'
jobs:
  newfoundland-history-and-desktop-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify story, institutional and primary transcriptions, all decade source IDs and nonmetric map areas
        run: |
          node --check scripts/test_editor10_newfoundland_story.js
          node --check scripts/test_editor6_17c_batch01.js
          node scripts/test_editor10_newfoundland_story.js
          node scripts/test_serial_story_contract.js
          node scripts/test_17c_tudor_parity_20261023.js
          node scripts/test_editor9_acadia_story.js
          node scripts/test_editor9_hudson_bay_story.js
          node scripts/test_editor7_17c_inline_story_map.js
          node scripts/test_editor6_17c_batch01.js
          node scripts/test_editor6_17c_georeference_r02.js
          node scripts/test_editor7_17c_regional_studies.js
          python3 scripts/audit_spatial_semantics.py --strict
      - name: Install desktop Selenium
        run: pip install selenium
      - name: Check real 1780-pixel desktop source-linked article to map to dossier round-trip
        run: |
          python -m http.server 8765 &
          python scripts/browser_editor10_newfoundland_story.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor10-newfoundland-desktop-evidence
          path: browser-smoke-results/editor10-newfoundland-*.png
