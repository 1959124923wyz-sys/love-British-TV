name: Editor42 5AH derive existing 1700-1711 Carolina candidate footprints
on:
  push:
    branches:
      - cartography/editor42-5ah-carolina-17c-rectangles
    paths:
      - scripts/editor42_5ah_carolina_historical_footprint_audit.py
permissions:
  contents: write
jobs:
  audited-geometry-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan the actual 4MB chronology database without rewriting historical boundaries
        run: python3 -u scripts/editor42_5ah_carolina_historical_footprint_audit.py
      - name: Commit only generated audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/18C_5AH_CAROLINA_EXISTING_GEOMETRY_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "research(5AH): register extant early-Carolina source geometries and periods"
            git push origin HEAD:cartography/editor42-5ah-carolina-17c-rectangles
          fi
