name: "1540s independent historical map research QA"
on:
  push:
    branches:
      - "research/territorial-1540-1549-20261013"
    paths:
      - "research/periods/1540-1549/**"
      - ".github/workflows/1540s-research-quality.yml"
  pull_request:
    paths:
      - "research/periods/1540-1549/**"
      - ".github/workflows/1540s-research-quality.yml"
permissions:
  contents: read
jobs:
  research-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Research data, chronology and control continuity audit
        run: python3 research/periods/1540-1549/validate_research.py

      - name: Validate independent 1540s preview JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("research/periods/1540-1549/interactive_research_preview.html").read_text()
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.S|re.I)
          assert blocks and blocks[-1].strip(), "Missing preview JS"
          Path("/tmp/1540s-map-preview.js").write_text(blocks[-1])
          PY
          node --check /tmp/1540s-map-preview.js
