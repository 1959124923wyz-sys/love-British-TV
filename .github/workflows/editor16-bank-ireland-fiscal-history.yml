name: Editor16 Bank of England and Cromwellian Ireland financial-history QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/e6-t15-bank-war-colonial-capital.json'
      - 'data/stories/serial/e6-t02-ireland-conquest-land-finance.json'
      - 'data/stories/serial/index.json'
      - 'data/research/e6t15-e6t02-war-finance-land-forfeiture-evidence-20261026.json'
      - 'scripts/test_editor16_bank_ireland_finance.js'
      - 'scripts/browser_editor16_bank_ireland_finance.py'
      - '.github/workflows/editor16-bank-ireland-fiscal-history.yml'
  push:
    branches:
      - 'research/editor16-*'
permissions:
  contents: read
jobs:
  source-crosscheck-and-desktop-map:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Validate both documentary stories and immutable territorial constraints
        run: |
          node scripts/test_editor16_bank_ireland_finance.js
          node scripts/test_serial_story_contract.js
          python3 scripts/audit_spatial_semantics.py --strict
      - name: Install desktop selenium
        run: pip install selenium
      - name: Test 1649/1694 real historic dossier, sections and returns
        run: |
          python3 -m http.server 8765 &
          python3 scripts/browser_editor16_bank_ireland_finance.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor16-bank-ireland-desktop-history-screenshots
          path: browser-smoke-results/editor16-*.png
          retention-days: 15
