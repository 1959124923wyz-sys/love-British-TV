name: Editor6 17c route, spatial and story desktop browser
on:
  pull_request:
    paths:
      - 'app.js'
      - 'data/atlas-16*.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/stories/serial/**'
      - 'scripts/browser_editor6_17c_spatial_story.py'
      - '.github/workflows/editor6-17c-browser.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'data/atlas-16*.json'
      - 'data/seventeenth-century-spatial-evidence-1600-1699.geojson'
      - 'data/stories/serial/**'
      - 'scripts/browser_editor6_17c_spatial_story.py'
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install selenium
      - name: Run historical 17C browser regression
        run: |
          python -m http.server 8765 &
          python scripts/browser_editor6_17c_spatial_story.py
      - name: Preserve desktop historical map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor6-seventeenth-century-desktop-map
          path: browser-smoke-results/editor6-*.png
