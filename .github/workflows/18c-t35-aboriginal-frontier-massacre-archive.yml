    branches:
      - map/18c-t35-indigenous-kidnapping-punitive-massacre-1788-1799-20261110
  pull_request:
    branches:
      - map/18c-t24-ceylon-1795-1797-coastal-invasion-tax-revolt-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seventeen-story-source-GIS-and-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify T35 source C archive all fifteen original IDs eleven old plus four recovered, 17 topic reader and no fake British territorial polygons
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_major_story_pilot.js
          node scripts/test_18c_frontier_archive_completion_map.js
          node scripts/test_18c_ceylon_conquest_tax_rebellion_map.js
          node scripts/test_18c_india_opium_salt_famine_map.js
          node scripts/test_18c_sierra_leone_colonial_land_map.js
          node scripts/test_18c_west_africa_slavery_map.js
          node scripts/test_18c_cape_khoekhoe_xhosa_map.js
          node scripts/test_18c_manila_sack_map.js
          node scripts/test_18c_carnatic_hyderabad_map.js
          node scripts/test_18c_maratha_rohilla_map.js
          node scripts/test_18c_mysore_map.js
          node scripts/test_18c_scotland_map.js
          node scripts/test_18c_australia_map.js
          node scripts/test_18c_ireland_map.js
          node scripts/test_18c_atlantic_zong_map.js
          node scripts/test_18c_jamaica_maroon_map.js
          node scripts/test_18c_bengal_continuity_map.js
          node scripts/test_18c_acadia_map_pilot.js
          node scripts/test_editor7_17c_inline_story_map.js
          node scripts/test_editor6_17c_spatial_batch01.js
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_frontier_original_C_sources.py
          python3 scripts/audit_18c_ceylon_original_sources.py
          python3 scripts/audit_18c_india_original_sources.py
          python3 scripts/audit_18c_sierra_leone_original_sources.py
          python3 scripts/audit_18c_west_africa_original_sources.py
          python3 scripts/audit_18c_cape_source_registry.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/stories/serial/chronology-preview-australia-frontier-1788-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/chronology-preview-ceylon-coastal-invasion-1791-1797.json >/dev/null
          python3 -m json.tool data/stories/serial/chronology-preview-india-opium-salt-1761-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/chronology-preview-sierra-leone-1728-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/chronology-preview-west-africa-1727-1792.json >/dev/null
          python3 -m json.tool data/stories/serial/chronology-preview-cape-1795-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t35-aboriginal-frontier-violence-1788-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t24-ceylon-british-invasion-tax-rebellion-1791-1797.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t21-east-india-opium-salt-famine-1761-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t27-sierra-leone-bunce-black-settlers-1728-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t26-west-africa-slave-forts-1727-1792.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t25-cape-invasion-khoekhoe-xhosa-1795-1799.json >/dev/null
          python3 -m json.tool research/continuity/1788-1799-australia/BRITISH_FRONTIER_MASSACRE_RESISTANCE_TRANSITIONS.json >/dev/null
          python3 -m json.tool research/continuity/1791-1797-ceylon/BRITISH_COASTAL_FORTS_KANDY_TAX_REVOLT_TRANSITIONS.json >/dev/null
          python3 -m json.tool research/continuity/1761-1799-india/EIC_OPIUM_SALT_TEXTILE_FAMINE_ACTOR_TRANSITIONS.json >/dev/null
          python3 -m json.tool research/continuity/1728-1799-sierra-leone/BUNCE_FREETOWN_AFRICAN_LAND_CONTROL_TRANSITIONS.json >/dev/null
          python3 -m json.tool research/continuity/1727-1792-west-africa/BRITISH_SLAVE_FORTS_AFRICAN_STATES_CONTROL_TRANSITIONS.json >/dev/null
          python3 -m json.tool research/continuity/1795-1799-cape/BRITISH_INVASION_INDIGENOUS_TERRITORIAL_TRANSITIONS.json >/dev/null
  real-desktop-chromium:
    needs: seventeen-story-source-GIS-and-reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: 1780x1020 genuine Aboriginal frontier military/court desktop + sixteen earlier study regressions and 16C
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-cape-http.log 2>&1 &
          python3 scripts/browser_18c_frontier_archive_completion.py
          python3 scripts/browser_18c_ceylon_conquest_tax_rebellion.py
          python3 scripts/browser_18c_india_opium_salt_famine.py
          python3 scripts/browser_18c_sierra_leone_colonial_land.py
          python3 scripts/browser_18c_west_africa_slavery.py
          python3 scripts/browser_18c_cape_khoekhoe_xhosa.py
          python3 scripts/browser_18c_manila_sack.py
          python3 scripts/browser_18c_carnatic_hyderabad.py
          python3 scripts/browser_18c_maratha_rohilla_awadh.py
          python3 scripts/browser_18c_mysore_wars.py
          python3 scripts/browser_18c_scotland_union.py
          python3 scripts/browser_18c_australia_resistance.py
          python3 scripts/browser_18c_ireland_rebellion.py
          python3 scripts/browser_18c_atlantic_zong.py
          python3 scripts/browser_18c_jamaica_maroon.py
          python3 scripts/browser_18c_bengal_continuity.py
          python3 scripts/browser_18c_acadia_pilot.py
          python3 scripts/browser_major_story_pilot.py
      - name: Upload 17-topic desktop images for real Indigenous victim cases and British punishments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-t35-aboriginal-frontier-massacres-court-resistance-desktop-images
          path: |
            browser-smoke-results/
            story-pilot-browser-results/
          if-no-files-found: ignore
  public-draft-web-preview:
    needs: seventeen-story-source-GIS-and-reader
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub branch static preview HTML JS CSS Atlas datasets and long story via external proxy
        run: |
          set -e
          BASE="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}"
          for path in index.html app.js js/history-stories.js css/history-stories.css data/stories/serial/preview-18c-index.json data/stories/serial/chronology-preview-australia-frontier-1788-1799.json data/stories/serial/e18-t35-aboriginal-frontier-violence-1788-1799.json; do
            curl --fail --location --retry 3 --retry-delay 3 --max-time 30 --silent --show-error "$BASE/$path" -o "/tmp/t35-$(basename "$path")"
          done
          grep -q '帝国的代价' /tmp/t35-index.html
          grep -q 'E18C-FRONTIER-1795-PATERSON-MILITARY-KILLS' /tmp/t35-chronology-preview-australia-frontier-1788-1799.json
          grep -q 'E18-T35-ABORIGINAL-FRONTIER-MASSACRE-1788-1799' /tmp/t35-preview-18c-index.json
          if grep -q 'story-reading-toolbar' /tmp/t35-history-stories.js; then echo 'BUG: deleted dynamic TOC still present'; exit 1; fi
          echo "ABORIGINAL_FRONTIER_REVIEW_URL=$BASE/index.html?review18c=1&year=1795"
