name: 18C Statia and Bencoolen
on:
  pull_request:
    paths:
      - 'app.js'
      - 'data/eighteenth-century-editor36-5z-waterways.geojson'
      - 'data/eighteenth-century-expansion-batch36-1700-1799.json'
      - 'data/eighteenth-century-b38-hudson-company.json'
      - 'js/eighteenth-editor36-5z-waterways.js'
      - 'scripts/test_editor36_5z_source_waterways.js'
      - 'scripts/browser_editor36_5z_waterways.cjs'
      - 'js/history-stories.js'
      - 'data/stories/serial/e18-*.json'
      - 'data/eighteenth-century-b37-india-ocean.json'
      - 'data/eighteenth-century-b39-gulf-surat-factories.json'
      - 'data/eighteenth-century-editor36-5y-named-sites.json'
      - 'js/eighteenth-batch39-spatial.js'
      - 'scripts/test_editor36_5y_named_sites.js'
      - 'data/eighteenth-century-dynamic-spatial-1700-1799.json'
      - 'scripts/*18c_statia_bencoolen*'
      - 'scripts/*18c_antigua_bermuda_bahamas*'
      - 'scripts/*18c_barbados_wir*'
      - 'scripts/*18c_prizes_malacca*'
      - 'scripts/*18c_acadia_jamaica*'
      - 'scripts/*18c_archive_gaps*'
      - 'scripts/*18c_original_records*'
      - 'scripts/*18c_ship_company_archive*'
      - 'scripts/*18c_final_priority_records*'
      - '.github/workflows/18c-statia-bencoolen.yml'
permissions:
  contents: read
jobs:
  topics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/eighteenth-editor36-5z-waterways.js
      - run: node scripts/test_editor36_5z_source_waterways.js
      - run: node scripts/test_editor36_5y_named_sites.js
      - run: node scripts/test_18c_batch39_126_83.js
      - run: node scripts/test_18c_statia_bencoolen.js
      - run: node scripts/test_18c_antigua_bermuda_bahamas.js
      - run: node scripts/test_18c_barbados_wir.js
      - run: node scripts/test_18c_prizes_malacca.js
      - run: node scripts/test_18c_acadia_jamaica.js
      - run: node scripts/test_18c_archive_gaps.js
      - run: node scripts/test_18c_original_records.js
      - run: node scripts/test_18c_ship_company_archive.js
      - run: python3 scripts/test_18c_final_priority_records.py
      - run: python3 scripts/audit_18c_1126_coverage.py --out-dir /tmp/atlas-18c-coverage
      - run: python3 scripts/audit_spatial_semantics.py --strict
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop chronology, map and dossier navigation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-topics-http.log 2>&1 &
          node scripts/browser_18c_statia_bencoolen.cjs
          node scripts/browser_editor36_5y_named_sites.cjs
          node scripts/browser_editor36_5z_waterways.cjs
