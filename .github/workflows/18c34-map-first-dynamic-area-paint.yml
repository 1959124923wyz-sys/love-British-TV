name: 18C map-first 24 changing zones 15 documented occupation cores rigorous temporal GIS
on:
  push:
    branches:
      - map/18c-34-dynamic-territory-occupation-influence-1700-1799-20261112
  pull_request:
    branches:
      - map/18c-33-awadh-begams-calabar-mikmaq-1761-1785-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thirtyfour-stories-and-18c-area-spatial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: GIS category, 24 reused inherited regions, 15 dated sites, no unauthorized land metrics, full 34 article regression
        run: |
          node --check app.js
          node --check js/eighteenth-dynamic-spatial.js
          node --check js/history-stories.js
          node scripts/test_18c_spatial_paint_24_15.js
          node scripts/test_major_story_pilot.js
          for test in scripts/test_18c_*.js; do node "$test"; done
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_r33_original_archive_gaps.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/eighteenth-century-dynamic-spatial-1700-1799.json >/dev/null
  real-desktop-spatial-animation:
    needs: thirtyfour-stories-and-18c-area-spatial-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Real 1780x1020 annual spatial painting, clicking, colonial loss, 34 topics and Tudor regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c34-http.log 2>&1 &
          python3 scripts/browser_18c_map_first_dynamic_areas.py
          for browser_test in scripts/browser_18c_*.py; do python3 "$browser_test"; done
          python3 scripts/browser_major_story_pilot.py
      - name: Preserve full desktop region animation and all 34 research articles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c34-dynamic-area-occupation-influence-desktop-screenshots
          path: |
            browser-smoke-results/
            story-pilot-browser-results/
          if-no-files-found: ignore
  public-geographic-preview:
    needs: thirtyfour-stories-and-18c-area-spatial-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify independent SHA-stable historical cartography, geometry source, and app viewer
        run: |
          set -eu
          BASE="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}"
          for path in index.html app.js js/eighteenth-dynamic-spatial.js data/eighteenth-century-dynamic-spatial-1700-1799.json data/seventeenth-century-expansive-colonial-claims-1600-1699.geojson js/history-stories.js data/stories/serial/preview-18c-index.json data/stories/serial/chronology-preview-r33-three-archival-gaps-1761-1790.json; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --output /dev/null "$BASE/$path"
          done
