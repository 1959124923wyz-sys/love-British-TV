name: Editor42 5AH apply dated Carolina settlements and retire last 18C rectangle
on:
  push:
    branches:
      - cartography/editor42-5ah-carolina-17c-rectangles
    paths:
      - scripts/apply_editor42_5ah_carolina_settlements.py
permissions:
  contents: write
jobs:
  preserve-original-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep original Carolina reference intact and add three dated sites
        run: python3 -u scripts/apply_editor42_5ah_carolina_settlements.py
      - name: Validate original eighteenth-century atlas and 5AG continuity
        run: |
          node scripts/test_18c_mass_spatial_81_42.js
          node scripts/test_editor41_5ag_localized_areas.js
          node scripts/test_editor42_5ah_carolina_17c_inventory.js
      - name: Verify historic 5AG point shortlist unchanged semantically and restore frozen JSON
        run: |
          git show HEAD:docs/research/18C_5AG_479_MASS_POINT_AREA_CANDIDATES.json > /tmp/5ag_original_candidates.json
          python3 scripts/research_editor41_5ag_mass_point_area_candidates.py
          python3 - <<'PY'
          import json
          with open('/tmp/5ag_original_candidates.json',encoding='utf-8') as f:
              previous=json.load(f)
          with open('docs/research/18C_5AG_479_MASS_POINT_AREA_CANDIDATES.json',encoding='utf-8') as f:
              now=json.load(f)
          assert previous==now, 'historic 5AG candidate IDs, sources or status changed'
          print('PASS 5AG original 479/165 audit is unchanged (JSON numeric 0 vs 0.0 ignored)')
          PY
          git restore docs/research/18C_5AG_479_MASS_POINT_AREA_CANDIDATES.json
      - name: Verify research data semantics and history source links
        run: python3 scripts/audit_spatial_semantics.py --strict
      - name: Commit changed map data only after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eighteenth-century-mass-schematic-zones-1700-1799.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(18c 5AH): replace Carolina charter bbox by dated Charleston Bath and New Bern sites"
            git push origin HEAD:cartography/editor42-5ah-carolina-17c-rectangles
          fi
