name: 18C T27 Sierra Leone Bunce slave fort and Black settler land autonomy QA
on:
  push:
    branches:
      - map/18c-sierra-leone-bunce-freetown-land-1728-1799-20261110
  pull_request:
    branches:
      - map/18c-west-africa-enslavement-forts-1750-1795-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fourteen-story-source-archive-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm T27 original four IDs, 7 B keys, non-additive 65/112 mortality, fourteen stories and strict GIS
        run: |
          node --check app.js
          node --check js/history-stories.js
          node scripts/test_major_story_pilot.js
          node scripts/test_18c_sierra_leone_bunce_land_map.js
          node scripts/test_18c_west_africa_slaving_map.js
          node scripts/test_18c_cape_khoekhoe_xhosa_map.js
          node scripts/test_18c_manila_sack_map.js
          node scripts/test_18c_carnatic_hyderabad_map.js
          node scripts/test_18c_maratha_rohilla_map.js
          node scripts/test_18c_mysore_map.js
          node scripts/test_18c_scotland_map.js
          node scripts/test_18c_australia_map.js
          node scripts/test_18c_ireland_map.js
          node scripts/test_18c_atlantic_zong_map.js
          node scripts/test_18c_jamaica_maroon_map.js
          node scripts/test_18c_bengal_continuity_map.js
          node scripts/test_18c_acadia_map_pilot.js
          node scripts/test_editor7_17c_inline_story_map.js
          node scripts/test_editor6_17c_spatial_batch01.js
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_sierra_leone_source_registry.py
          python3 scripts/audit_spatial_semantics.py --strict
          python3 -m json.tool data/stories/serial/chronology-preview-sierra-leone-1700-1799.json >/dev/null
          python3 -m json.tool data/stories/serial/e18-t27-sierra-leone-bunce-black-settlers-1728-1799.json >/dev/null
          python3 -m json.tool research/continuity/1728-1799-sierra-leone/BUNCE_COMPANY_BLACK_FREEHOLD_TRANSITIONS.json >/dev/null
  actual-fourteen-story-desktop-chromium:
    needs: fourteen-story-source-archive-gis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: True 1780x1020 T27 Bunce, Freetown free Black land and all thirteen previous reader regressions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c-sierra-leone-http.log 2>&1 &
          python3 scripts/browser_18c_sierra_leone_bunce_land.py
          python3 scripts/browser_18c_west_africa_slaving.py
          python3 scripts/browser_18c_cape_khoekhoe_xhosa.py
          python3 scripts/browser_18c_manila_sack.py
          python3 scripts/browser_18c_carnatic_hyderabad.py
          python3 scripts/browser_18c_maratha_rohilla_awadh.py
          python3 scripts/browser_18c_mysore_wars.py
          python3 scripts/browser_18c_scotland_union.py
          python3 scripts/browser_18c_australia_resistance.py
          python3 scripts/browser_18c_ireland_rebellion.py
          python3 scripts/browser_18c_atlantic_zong.py
          python3 scripts/browser_18c_jamaica_maroon.py
          python3 scripts/browser_18c_bengal_continuity.py
          python3 scripts/browser_18c_acadia_pilot.py
          python3 scripts/browser_major_story_pilot.py
      - name: Preserve real desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c-sierra-leone-bunce-black-land-freehold-desktop-screenshots
          path: |
            browser-smoke-results/
            story-pilot-browser-results/
          if-no-files-found: ignore
  public-history-review-web:
    needs: fourteen-story-source-archive-gis
    runs-on: ubuntu-latest
    steps:
      - name: Confirm static review HTML CSS JS index archival data and narrative actually resolve over HTTP
        run: |
          set -e
          BASE="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}"
          for path in index.html app.js js/history-stories.js css/history-stories.css data/stories/serial/preview-18c-index.json data/stories/serial/chronology-preview-sierra-leone-1700-1799.json data/stories/serial/e18-t27-sierra-leone-bunce-black-settlers-1728-1799.json; do
            curl --fail --location --retry 3 --retry-delay 3 --max-time 30 --silent --show-error "$BASE/$path" -o "/tmp/t27-$(basename "$path")"
          done
          grep -q '帝国的代价' /tmp/t27-index.html
          grep -q 'E18C-SL-1799-SIERRA-LEONE-COMPANY-FREEHOLD-REFUSAL' /tmp/t27-chronology-preview-sierra-leone-1700-1799.json
          grep -q 'E18-T27-SIERRA-LEONE-BUNCE-BLACK-SETTLERS-1728-1799' /tmp/t27-preview-18c-index.json
          if grep -q 'story-reading-toolbar' /tmp/t27-history-stories.js; then echo 'Bug: floating chapter directory returned'; exit 1; fi
          echo "SIERRA_LEONE_REVIEW_URL=$BASE/index.html?review18c=1&year=1792"
