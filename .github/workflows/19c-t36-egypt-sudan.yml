name: 19C T36 Egypt Sudan British bombardment conquest railway and evidence GIS QA
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t36-egypt-sudan-conquest-1875-1899.json'
      - 'data/stories/serial/index.json'
      - 'data/stories/serial/chronology-1870-1879.json'
      - 'data/stories/serial/chronology-1880-1889.json'
      - 'data/stories/serial/chronology-1890-1899.json'
      - 'data/nineteenth-century-spatial-*.geojson'
      - 'docs/research/19C_T36_*'
      - 'research/19c/consolidated/**'
      - 'scripts/test_19c_t36_egypt_sudan.cjs'
      - 'scripts/browser_19c_t36_egypt_sudan.py'
      - '.github/workflows/19c-t36-egypt-sudan.yml'
  push:
    branches: [main]
    paths:
      - 'data/stories/serial/e19-t36-egypt-sudan-conquest-1875-1899.json'
permissions:
  contents: read
jobs:
  evidence-and-gis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/test_19c_t36_egypt_sudan.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_serial_story_contract.js
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  desktop-real-chrome:
    needs: evidence-and-gis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t36.log 2>&1 &
          python3 scripts/browser_19c_t36_egypt_sudan.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t36-egypt-sudan-colonial-conquest-gis-desktop
          path: browser-smoke-results/19c-t36-*.png
          if-no-files-found: ignore
