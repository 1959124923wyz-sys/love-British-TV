name: 19C T19 T20 T31 T38 India East Africa and Cape evidence GIS
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t19-*.json'
      - 'data/stories/serial/e19-t20-*.json'
      - 'data/stories/serial/e19-t31-*.json'
      - 'data/stories/serial/e19-t38-*.json'
      - 'data/stories/serial/index.json'
      - 'research/19c/consolidated/T19*'
      - 'research/19c/consolidated/T20*'
      - 'research/19c/consolidated/T31*'
      - 'research/19c/consolidated/T38*'
      - 'scripts/test_19c_t19_t20_t31_t38.cjs'
      - 'scripts/browser_19c_t19_t20_t31_t38.py'
      - '.github/workflows/19c-t19-t20-t31-t38.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  primary-source-and-gis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 73 links 69 new 23 GIS points and immutable archive
        run: |
          node --check scripts/test_19c_t19_t20_t31_t38.cjs
          node scripts/test_19c_t19_t20_t31_t38.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_serial_story_contract.js
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
  independent-true-desktop-chrome:
    needs: primary-source-and-gis
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t19-t38.log 2>&1 &
          python3 scripts/browser_19c_t19_t20_t31_t38.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t19-t20-t31-t38-independent-chrome
          path: browser-smoke-results/19c-t*.png
          if-no-files-found: ignore
