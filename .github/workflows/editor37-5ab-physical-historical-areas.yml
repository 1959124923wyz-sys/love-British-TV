name: Editor37 5AB geographic islands coasts fort sites
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'data/eighteenth-century-editor37-5ab-physical-areas.geojson'
      - 'data/eighteenth-century-b37-africa.json'
      - 'data/eighteenth-century-b39-gold-coast-forts.json'
      - 'data/eighteenth-century-b39-caribbean-1759-1763.json'
      - 'data/eighteenth-century-expansion-batch36-1700-1799.json'
      - 'js/eighteenth-editor37-5ab-physical-areas.js'
      - 'scripts/test_editor37_5ab_source_geography.js'
      - 'scripts/browser_editor37_5ab_physical_areas.cjs'
  push:
    branches: [main]
    paths:
      - 'data/eighteenth-century-editor37-5ab-physical-areas.geojson'
      - 'js/eighteenth-editor37-5ab-physical-areas.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-shapes-and-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/eighteenth-editor37-5ab-physical-areas.js
      - run: node scripts/test_editor37_5ab_source_geography.js
      - run: python3 scripts/audit_spatial_semantics.py --strict
      - run: node scripts/test_atlas_47_public_copy_guard.js
      - run: node scripts/lint_atlas_47_frontend_copy.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Desktop 5AB history, sources, shape clicks and 1799-1800
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-5ab-http.log 2>&1 &
          node scripts/browser_editor37_5ab_physical_areas.cjs
          node scripts/browser_19c_territorial_areas.cjs
      - name: Preserve 5AB desktop proof screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor37-5ab-desktop-geo-source-dossier
          path: browser-smoke-results/18c-5ab-gold-coast-1799-dossier.png
          if-no-files-found: ignore
