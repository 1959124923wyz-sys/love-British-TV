name: 18C batch37 west Africa Indian Ocean Caribbean 141 dated zones 108 cores
on:
  push:
    branches:
      - map/18c-37-westafrica-ports-india-caribbean-dynamics-20261112
  pull_request:
    branches:
      - map/18c-36-mass-frontiers-mysore-caribbean-1700-1799-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas37-static-archive-gis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Historical geometry semantic, source integrity and previous 34–36 map/31 stories regression
        run: |
          node --check app.js
          for f in js/eighteenth-*.js; do node --check "$f"; done
          node scripts/test_18c_batch37_141_108.js
          node scripts/test_18c_batch36_130_83.js
          node scripts/test_18c_mass_spatial_81_42.js
          node scripts/test_18c_spatial_paint_24_15.js
          for test in scripts/test_18c_*.js; do node "$test"; done
          for json in data/eighteenth-century-b37-{africa,india-ocean,caribbean}.json; do
            python3 -m json.tool "$json" >/dev/null
          done
          python3 scripts/test_18c_archival_integrity.py
          python3 scripts/audit_18c_r33_original_archive_gaps.py
          python3 scripts/audit_spatial_semantics.py --strict
  atlas37-real-desktop:
    needs: atlas37-static-archive-gis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - name: Real 1780 by 1020 Chromium annual GIS, 15 dates and regressions for PR329-331
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/18c37-http.log 2>&1 &
          python3 scripts/browser_18c_batch37_141_108.py
          python3 scripts/browser_18c_batch36_130_83.py
          python3 scripts/browser_18c_mass_schematic_81_42.py
          python3 scripts/browser_18c_map_first_dynamic_areas.py
      - name: Preserve evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18c37-desktop-376-dated-zones-248-sites-evidence
          path: browser-smoke-results/
          if-no-files-found: ignore
  atlas37-public-sha-preview:
    needs: atlas37-static-archive-gis
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify public fixed-commit archive and map scripts
        run: |
          set -eu
          BASE="https://raw.githack.com/$GITHUB_REPOSITORY/$GITHUB_SHA"
          for f in index.html app.js js/eighteenth-dynamic-spatial.js js/eighteenth-mass-spatial.js js/eighteenth-batch36-spatial.js js/eighteenth-batch37-spatial.js data/eighteenth-century-b37-africa.json data/eighteenth-century-b37-india-ocean.json data/eighteenth-century-b37-caribbean.json; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --output /dev/null "$BASE/$f"
          done
