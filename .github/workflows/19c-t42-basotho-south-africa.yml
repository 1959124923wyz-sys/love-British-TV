name: 19C T42 Basotho cattle seizures gun war Walvis and Bechuanaland history GIS
on:
  pull_request:
    paths:
      - 'data/stories/serial/e19-t42-basotho-cattle-disarmament-southern-protectorates-1852-1890.json'
      - 'docs/research/19C_T42_*'
      - 'research/19c/consolidated/T42*'
      - 'scripts/test_19c_t42_basotho_south_africa.cjs'
      - 'scripts/browser_19c_t42_basotho_south_africa.py'
      - '.github/workflows/19c-t42-basotho-south-africa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-gis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      is_published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Dedicated fact, story, event, source and geometry checks
        run: |
          node --check scripts/test_19c_t42_basotho_south_africa.cjs
          node scripts/test_19c_t42_basotho_south_africa.cjs
          python3 research/19c/consolidated/verify.py
          python3 research/19c/consolidated/verify_handoff.py
          python3 scripts/audit_spatial_semantics.py --strict
          node scripts/test_serial_story_contract.js
          node scripts/test_atlas_47_public_copy_guard.js
          node scripts/lint_atlas_47_frontend_copy.js
      - name: Record independent publication approval
        id: release
        run: |
          node -e 'const x=require("./data/stories/serial/index.json").topics.find(t=>t.id==="E19-T42-BASOTHO-CATTLE-DISARMAMENT-SOUTHERN-PROTECTORATES");console.log("published="+String(x.status==="published"&&x.publication_review==="approved"))' >> "$GITHUB_OUTPUT"
  desktop-real-chrome:
    # One authentic browser gate when the story goes public.
    # Production draft stays in fast static review; no repeated 1497-1799 scan.
    if: needs.evidence-and-gis.outputs.is_published == 'true'
    needs: evidence-and-gis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet selenium==4.28.1
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-t42.log 2>&1 &
          python3 scripts/browser_19c_t42_basotho_south_africa.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t42-basotho-war-continental-protectorates-desktop
          path: browser-smoke-results/19c-t42-*.png
          if-no-files-found: ignore
