const reference=data.features.filter(f=>f.geometry.type==='Point'&&f!==city);
function render(){const yr=+document.getElementById('yr').value,occupied=yr>=1513&&yr<=1518;
 document.getElementById('y').textContent=yr;under.clearLayers();over.clearLayers();sites.clearLayers();
 let desc=yr<1513?'图尔奈仍处于法王权力体系中。1513年的英军围城与接管尚未发生。':yr===1513?'1513年9月，图尔奈向亨利八世投降。英王设置总督及驻军，市政机关继续运作。':yr<=1517?'英王继续管理图尔奈城。城外围绕共同司法与乡村领主权益形成复杂的行政关系。':yr===1518?'10月英法签订归还条约。图尔奈仍有英方驻军，移交安排继续商议。':'1519年2月，英军撤出图尔奈，法王恢复治理。新占领区域在年末地图中退出。';
 document.getElementById('story').textContent=desc;
 if(occupied&&document.getElementById('drawOuter').checked){L.geoJSON(region,{style:{color:'#d4a566',weight:3,dashArray:'10 8',opacity:.9,fillColor:'#efc081',fillOpacity:.10}}).bindPopup('<b>'+safe(region.properties.public_title)+'</b><br/>'+safe(region.properties.public_summary)+'<br/>轮廓由现代村庄中心构成，为研究层而非历史实控边界。').addTo(under)}
 if(occupied){const p=city.geometry.coordinates;L.circleMarker([p[1],p[0]],{radius:9,color:'#713f16',weight:3,fillColor:'#e7a54d',fillOpacity:.95}).bindPopup('<b>'+safe(city.properties.public_title)+'</b><br/>'+safe(city.properties.public_summary)).addTo(over)}
 if(document.getElementById('drawSites').checked){for(const f of reference){const p=f.geometry.coordinates;const special=/SAINT-AMAND|MORTAGNE/.test(f.properties.id);L.circleMarker([p[1],p[0]],{radius:special?5:3,color:special?'#b94650':'#617b96',fillColor:'#fff',weight:1.4,fillOpacity:.8}).bindPopup('<b>'+safe(f.properties.label)+'</b><br/>'+(special?'地区关联的独立领主/宗教财产，不作英王直接实控断言。':'现代地名参考点，不等于英王实际管辖的证据。')).addTo(sites)}}
}
document.querySelectorAll('#yr,#drawOuter,#drawSites').forEach(x=>x.addEventListener('input',render));render();
const legend=L.control({position:'bottomright'});legend.onAdd=()=>{const n=L.DomUtil.create('div','legend');n.innerHTML='🟠 图尔奈城市驻军实控点<br/>- - 外围研究包络（现代地名推定）<br/>此包络不等于历史确权面积';return n};legend.addTo(map);
</script></body></html>
